name: Build & Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; cancel in-progress runs for the same ref.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Quality gate (lint + typecheck + format)
        run: npm run quality:check

      - name: Unit / component / a11y tests
        run: npm test

      - name: Build static export
        run: npm run build
        env:
          NODE_ENV: production
          # Project page lives under /portfolio. Override here if a custom domain is added.
          BASE_PATH: /portfolio
          # GoatCounter analytics — set the GOATCOUNTER_CODE repo variable to enable.
          NEXT_PUBLIC_GOATCOUNTER_CODE: ${{ vars.GOATCOUNTER_CODE }}

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

      # A green deploy says the artifact was published, not that the site works
      # or that it is even this artifact — an older run can be live and still
      # read "success" (CON-VER-003). This asserts against the running site and
      # fails the job, which is what CON-COV-001 has asked for since 2026-08-08
      # and what no project here had implemented (SPEC-0003).
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 20

      - name: Verify the deployed site is this commit, and works
        run: |
          node scripts/verify-live.mjs \
            --base "${{ steps.deployment.outputs.page_url }}" \
            --commit "${{ github.sha }}"
