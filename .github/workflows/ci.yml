name: CI (pull requests)

on:
  pull_request:
    branches: [main]

# Check-only workflow — least-privilege token.
permissions:
  contents: read

# Cancel superseded runs for the same PR.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Quality gate (lint + typecheck + format)
        run: npm run quality:check

      - name: Unit / component / a11y tests (with coverage thresholds)
        run: npm run test:coverage

      - name: Build static export
        run: npm run build
        env:
          NODE_ENV: production
          BASE_PATH: /portfolio

      # External links rot off-box, after merge, when someone else's site
      # changes — no other check can catch that. Advisory only: a third party
      # having an outage must not block our merge. But an advisory step that
      # merely goes green is useless, because nobody reads a passing log — so
      # the result is written to the run summary where it is actually visible.
      - name: External link integrity (advisory)
        if: always()
        run: |
          set +e
          npm run check:links > /tmp/links.txt 2>&1
          status=$?
          {
            echo "### External link check"
            echo ""
            if [ "$status" -eq 0 ]; then echo "All content links resolved."; else echo "⚠️ Some links did not resolve — see below."; fi
            echo ""
            echo '```'
            tail -30 /tmp/links.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Install Playwright browser
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system deps (cache hit)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: E2E smoke tests (desktop + mobile)
        run: npx playwright test
