name: CI (pull requests)

on:
  pull_request:
    branches: [main]

# Check-only workflow — least-privilege token.
permissions:
  contents: read

# Cancel superseded runs for the same PR.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # Full history so the spec-discipline step can diff against the base.
          fetch-depth: 0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # SPEC.md §9.1: a behavioural change carries its spec. tests/adr.test.ts
      # can only validate records that exist — it cannot see a missing one — so
      # the presence of a spec change is guarded here instead. Ordering
      # (spec commit before implementation) is visible in the PR's commit list
      # but cannot be enforced from main, which is squash-merged.
      - name: Spec discipline (schema change carries a spec change)
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          if [ -z "$base" ] || ! git cat-file -e "$base" 2>/dev/null; then
            echo "::warning::base sha unavailable — skipping spec-discipline check"
            exit 0
          fi
          changed=$(git diff --name-only "$base"...HEAD)
          echo "Changed files:"; echo "$changed" | sed 's/^/  /'
          if echo "$changed" | grep -qx 'src/content/schema.ts'; then
            if echo "$changed" | grep -qE '^(SPEC\.md|specs/|docs/adr/)'; then
              echo "Schema change is accompanied by a spec change."
            else
              echo "::error::src/content/schema.ts changed without SPEC.md, specs/ or docs/adr/. See SPEC.md §9.1 — a new schema field needs a spec edit and an ADR."
              exit 1
            fi
          else
            echo "No schema change; no spec required."
          fi

      - name: Quality gate (lint + typecheck + format)
        run: npm run quality:check

      # One named step per suite, so a red check says WHICH KIND of thing broke
      # before anyone opens the log: the code, the published record, or access.
      # They run before the coverage pass rather than instead of it — coverage
      # has to see all three at once or a file covered only by another suite
      # reads as uncovered (SPEC-0001).
      - name: Suite — contract (data and the published record)
        run: npm run test:contract

      - name: Suite — unit (does the code do what it says)
        run: npm run test:unit

      - name: Suite — accessibility
        run: npm run test:a11y

      - name: Coverage floors (aggregate, per directory, and per file)
        run: npm run test:coverage

      # Two trees, two thresholds. Being in the production dependency tree is
      # not the same as reaching a browser, and on a static export the gap is
      # total — but build dependencies execute with real credentials here, which
      # is the live supply-chain path (proposed fleet-wide in vivekanandba/constitution#5). Advisories that cannot be
      # patched carry a recorded reason in security/audit-allowlist.json, and
      # the script fails if one of those outlives the advisory it excuses.
      - name: Suite — security (dependency advisories, both trees)
        run: npm run test:security

      - name: Build static export
        run: npm run build
        env:
          NODE_ENV: production
          BASE_PATH: /portfolio

      # Nothing measured what ships. A 3 MB photograph would have deployed
      # without a word, and the first person to notice would be a reader on a
      # phone (SPEC-0003).
      - name: Size budgets for the built output
        run: npm run check:size

      # External links rot off-box, after merge, when someone else's site
      # changes — no other check can catch that. Advisory only: a third party
      # having an outage must not block our merge. But an advisory step that
      # merely goes green is useless, because nobody reads a passing log — so
      # the result is written to the run summary where it is actually visible.
      - name: External link integrity (advisory)
        if: always()
        run: |
          set +e
          npm run check:links > /tmp/links.txt 2>&1
          status=$?
          {
            echo "### External link check"
            echo ""
            if [ "$status" -eq 0 ]; then echo "All content links resolved."; else echo "⚠️ Some links did not resolve — see below."; fi
            echo ""
            echo '```'
            tail -30 /tmp/links.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0 # full history so gitleaks can scan every commit

      # The hooks scan the working tree; nothing had ever scanned the history.
      # On 2026-07-23 a personal-data export reached this repo and had to be
      # purged, which a working-tree check could not have caught (proposed fleet-wide in vivekanandba/constitution#5).
      # Same job as wealth-weave's, copied rather than reinvented.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: '8.21.2'
        run: |
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Suite — secrets (full history)
        run: gitleaks detect --source . --redact --verbose

  # Pixel baselines run inside the Playwright container, not on the runner,
  # because the committed images were made there and text renders differently
  # between machines. Its own job so a font difference cannot take the
  # behavioural e2e suite down with it (SPEC-0003).
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.51.1-noble
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - run: npm ci

      - name: Suite — visual (pixel baselines)
        run: npm run test:visual
        env:
          CI: 'true'

      # The diff image is the only useful thing when this fails; a percentage
      # tells you nothing about what moved.
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: visual-diff
          path: test-results/
          retention-days: 7

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Install Playwright browser
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system deps (cache hit)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Suite — e2e (can a person complete the task)
        run: npm run test:e2e
        # `npm run test:e2e`, not a bare `playwright test`: the bare form runs
        # every project, including the pixel baselines, on this bare runner —
        # whose fonts differ from the container the baselines were made in. The
        # 1% tolerance hid that for weeks; the 120px budget exposed it (#74).
